<h1>Бесплатная диагностика</h1>
<p style="color:var(--mute);max-width:40rem">Шесть вопросов о вашей ситуации. Это ориентир, а не прогноз суда.</p>{{result}}
<form method="post" action="/diagnostic">
<fieldset><legend>Кто заказчик</legend>
<label><input type="radio" name="who" value="person" required> Физическое лицо</label>
<label><input type="radio" name="who" value="org"> ИП или организация</label></fieldset>
<fieldset><legend>Договорённости</legend>
<label><input type="radio" name="contract" value="written" required> Есть письменный договор</label>
<label><input type="radio" name="contract" value="chat"> Только переписка</label>
<label><input type="radio" name="contract" value="oral"> Только на словах</label></fieldset>
<fieldset><legend>Что у вас есть</legend>
<label><input type="checkbox" name="ev" value="chat"> Переписка о задании и цене</label>
<label><input type="checkbox" name="ev" value="handed"> Подтверждение, что результат передан</label>
<label><input type="checkbox" name="ev" value="act"> Подписанный акт</label>
<label><input type="checkbox" name="ev" value="check"> Чек из «Мой налог»</label>
<label><input type="checkbox" name="ev" value="partial"> Частичные оплаты раньше</label>
<label><input type="checkbox" name="ev" value="confess"> Сообщение, где заказчик признаёт долг</label></fieldset>
<fieldset><legend>Сумма долга</legend>
<label><input type="radio" name="amount" value="small" required> До 500 000 ₽</label>
<label><input type="radio" name="amount" value="big"> Больше 500 000 ₽</label></fieldset>
<fieldset><legend>Когда нужно было заплатить</legend>
<label><input type="radio" name="age" value="new" required> Меньше трёх лет назад</label>
<label><input type="radio" name="age" value="old"> Больше трёх лет назад</label></fieldset>
<fieldset><legend>Заказчик сейчас</legend>
<label><input type="radio" name="state" value="promise" required> На связи, обещает заплатить</label>
<label><input type="radio" name="state" value="refuse"> На связи, отказывается</label>
<label><input type="radio" name="state" value="silent"> Молчит или заблокировал</label></fieldset>
<p><button class="btn" type="submit">Узнать результат</button></p></form>
